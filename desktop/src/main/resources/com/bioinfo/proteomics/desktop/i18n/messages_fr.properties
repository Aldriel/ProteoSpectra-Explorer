footer.author=© 2026 Maxime Ethier – Consultant en Bio-informatique
footer.availability=Disponible pour des contrats ou un emploi en bio-informatique.
footer.kofi=Soutenez-moi sur Ko-fi
footer.license=Licence Apache 2.0
tip.sequence=Lettres à un caractère. Modifications entre crochets après le résidu : M[Oxidation], \
    S[Phospho], S[+79.966]. N-terminal : [Acetyl]-PEPTIDE.
tip.maxCharge=Nombre d’états de charge [M+zH] listés (1 à 10).
tip.massType=Monoisotopique : isotope le plus léger (spectres haute résolution). Moyenne : \
    abondances isotopiques naturelles.
tip.carbamidomethyl=Ajoute +57,021 Da à chaque cystéine (alkylation à l’iodoacétamide).
tip.oxidation=Ajoute +15,995 Da à chaque méthionine. Les résidus déjà modifiés dans la \
  séquence restent tels quels.
tip.phospho=Ajoute +79,966 Da (groupement phosphate HPO₃) à chaque sérine, thréonine et \
  tyrosine. Les résidus déjà modifiés dans la séquence restent tels quels.
tip.deamidation=Ajoute +0,984 Da à chaque asparagine et glutamine. Les résidus déjà modifiés \
  dans la séquence restent tels quels.
tip.reverse=Remplace la séquence par son leurre inversé (ACDEFGH devient HGFEDCA) et le \
  calcule. Le leurre a la même masse que le peptide d’origine ; seuls ses fragments changent.
tip.shuffle=Remplace la séquence par un leurre aux résidus mélangés au hasard et le calcule. \
  Chaque clic donne un nouvel ordre ; la masse reste celle du peptide d’origine.
tip.openReference=Ouvre un second fichier MGF ou JSON dont les spectres servent de référence. \
  Le spectre identifié avec le même peptide que le spectre sélectionné est choisi d’office.
tip.theoretical=Calcule le spectre théorique (ions b et y) du peptide saisi ci-dessus, ou du \
  peptide identifié du spectre si le champ est vide, et le compare au spectre sélectionné.
tip.reference=Spectre comparé au spectre sélectionné. Un clic droit sur un spectre de la \
  liste permet aussi de l’utiliser comme référence.
tip.comparisonMode=Miroir : la référence est dessinée vers le bas. Superposition : les deux \
  spectres vers le haut. La référence est mise à l’échelle du pic de base du spectre.
tip.clearReference=Ne compare plus le spectre sélectionné à une référence.
tip.ions=Séries d’ions fragments : a et b (N-terminaux), y (C-terminaux).
tip.open=Ouvre un fichier de spectres JSON ou MGF, compressé (.gz) ou non. Le chargement remplace \
    la liste actuelle.
tip.parseMode=Tolérant : les entrées invalides sont ignorées et signalées. Strict : la première \
    erreur rejette tout le fichier. À choisir avant d’ouvrir le fichier.
tip.usi=Universal Spectrum Identifier d’un spectre public, ex. \
    mzspec:PXD000561:…:scan:17555:VLHPLEGAVVIIFK/2
tip.annotationPeptide=Peptide à tester sur le spectre. Laissez vide pour utiliser l’identification \
    du spectre.
tip.tolerance=Écart maximal entre m/z observée et théorique : 10 à 20 ppm pour un Orbitrap, \
    environ 0,5 Da pour une trappe ionique.
tip.annotate=Recherche dans le spectre les pics correspondant aux ions b et y théoriques du peptide.
tip.digestTable=Double-cliquez sur un peptide pour le calculer dans l’onglet Peptide. Clic droit : \
    annoter le spectre sélectionné avec ce peptide, ou copier sa séquence.
tip.spectrumList=Clic droit sur un spectre identifié : calculer son peptide dans l’onglet Peptide, \
    ou copier sa séquence.
action.calculatePeptide=Calculer dans l’onglet Peptide
action.annotateSpectrum=Annoter le spectre sélectionné avec ce peptide
action.copySequence=Copier la séquence
action.useAsReference=Utiliser comme spectre de référence
tip.fullView=Affiche toute la plage de m/z du spectre (comme un double-clic sur le graphique).
tip.accession=Accession UniProtKB, ex. P69905 (hémoglobine α), P02769 (albumine bovine), P69905-2 \
    (isoforme).
tip.enzyme=Enzyme utilisée pour la digestion in silico.
tip.missedCleavages=Nombre maximal de sites de coupure internes non coupés par peptide.
tip.peptideLength=Longueur des peptides conservés, en résidus. 6 à 30 convient à la trypsine ; \
    élargissez le maximum pour Lys-C ou Glu-C, qui produisent des peptides plus longs.
tip.prideSearch=Accession d’un projet (PXD suivi de 6 chiffres) pour l’ouvrir directement, ou \
    mots-clés (titre, espèce, instrument…) pour chercher.
tip.projectTable=Cliquez sur un projet pour afficher sa fiche et ses fichiers.
tip.fileTable=Double-cliquez sur un fichier MGF ou JSON pour le télécharger et l’ouvrir dans \
    l’onglet Spectres. Les fichiers grisés ne sont pas lisibles.
tip.readableOnly=Masque les fichiers que l’application ne sait pas lire (RAW, mzML, résultats…).
tip.download=Télécharge le fichier sélectionné puis affiche ses spectres. Une confirmation est \
    demandée au-delà de 50 Mo.
tip.save=Enregistre le fichier sélectionné, quel que soit son format, dans le dossier de votre \
    choix. Une confirmation est demandée au-delà de 50 Mo.
tip.cancelDownload=Interrompt le téléchargement en cours.

