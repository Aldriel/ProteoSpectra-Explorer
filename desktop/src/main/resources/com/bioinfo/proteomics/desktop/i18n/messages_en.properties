tip.sequence=One-letter codes. Modifications in brackets after the residue: M[Oxidation], \
    S[Phospho], S[+79.966]. N-terminal: [Acetyl]-PEPTIDE.
tip.maxCharge=Number of [M+zH] charge states listed (1 to 10).
tip.massType=Monoisotopic: lightest isotope (high-resolution spectra). Average: natural isotopic \
    abundances.
tip.carbamidomethyl=Adds +57.021 Da to every cysteine (iodoacetamide alkylation).
tip.oxidation=Adds +15.995 Da to every methionine. Residues already modified in the sequence \
  are left as written.
tip.phospho=Adds +79.966 Da (HPO₃ phosphate group) to every serine, threonine and tyrosine. \
  Residues already modified in the sequence are left as written.
tip.deamidation=Adds +0.984 Da to every asparagine and glutamine. Residues already modified in \
  the sequence are left as written.
tip.reverse=Replaces the sequence by its reversed decoy (ACDEFGH becomes HGFEDCA) and \
  calculates it. The decoy has the mass of the original peptide; only its fragments change.
tip.shuffle=Replaces the sequence by a decoy whose residues are randomly shuffled, and \
  calculates it. Each click gives a new order; the mass stays that of the original peptide.
tip.openReference=Opens a second MGF or JSON file whose spectra are used as references. The \
  spectrum identified with the same peptide as the selected spectrum is chosen first.
tip.theoretical=Computes the theoretical spectrum (b and y ions) of the peptide typed above, or \
  of the peptide identified in the spectrum if the field is empty, and compares it.
tip.reference=Spectrum compared with the selected spectrum. Right-clicking a spectrum of the \
  list also makes it the reference.
tip.comparisonMode=Mirror: the reference is drawn downwards. Overlay: both spectra upwards. \
  The reference is scaled to the base peak of the spectrum.
tip.clearReference=Stops comparing the selected spectrum with a reference.
tip.ions=Fragment ion series: a and b (N-terminal), y (C-terminal).
tip.open=Opens a JSON or MGF spectrum file, compressed (.gz) or not. Loading replaces the current \
    list.
tip.parseMode=Lenient: invalid entries are skipped and reported. Strict: the first error rejects \
    the whole file. Choose before opening the file.
tip.usi=Universal Spectrum Identifier of a public spectrum, e.g. \
    mzspec:PXD000561:…:scan:17555:VLHPLEGAVVIIFK/2
tip.annotationPeptide=Peptide to test against the spectrum. Leave empty to use the spectrum’s \
    identification.
tip.tolerance=Maximum difference between observed and theoretical m/z: 10 to 20 ppm for an \
    Orbitrap, about 0.5 Da for an ion trap.
tip.annotate=Finds the peaks of the spectrum matching the theoretical b and y ions of the peptide.
tip.digestTable=Double-click a peptide to compute it in the Peptide tab. Right-click: annotate the \
    selected spectrum with this peptide, or copy its sequence.
tip.spectrumList=Right-click an identified spectrum: compute its peptide in the Peptide tab, or \
    copy its sequence.
action.calculatePeptide=Calculate in the Peptide tab
action.annotateSpectrum=Annotate the selected spectrum with this peptide
action.copySequence=Copy sequence
action.useAsReference=Use as reference spectrum
tip.fullView=Shows the whole m/z range of the spectrum (same as a double-click on the chart).
tip.accession=UniProtKB accession, e.g. P69905 (hemoglobin alpha), P02769 (bovine albumin), \
    P69905-2 (isoform).
tip.enzyme=Enzyme used for the in silico digestion.
tip.missedCleavages=Maximum number of uncleaved internal sites per peptide.
tip.peptideLength=Length of the peptides kept, in residues. 6 to 30 suits trypsin; raise the \
    maximum for Lys-C or Glu-C, which produce longer peptides.
tip.prideSearch=A project accession (PXD followed by 6 digits) opens it directly; keywords (title, \
    species, instrument…) search for projects.
tip.projectTable=Click a project to display its details and files.
tip.fileTable=Double-click an MGF or JSON file to download it and open it in the Spectra tab. \
    Greyed-out files cannot be read.
tip.readableOnly=Hides the files that the application cannot read (RAW, mzML, results…).
tip.download=Downloads the selected file, then displays its spectra. Files larger than 50 MB ask \
    for confirmation.
tip.save=Saves the selected file, whatever its format, in the folder of your choice. Files larger \
    than 50 MB ask for confirmation.
tip.cancelDownload=Stops the current download.

